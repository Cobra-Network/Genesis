<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play | Genesis</title>
    <link href="/css/global.css" rel="stylesheet">
    <script src="/js/global.js" type="module"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            text-align: left;
        }
        .container {
            display: flex;
            align-items: flex-start;
            padding: 20px;
        }
        .game-container {
            flex-grow: 1;
            height: calc((100vw - 360px) * 9 / 16 + 30px);
            border-radius: 18px;
            animation: fadeIn 0.5s ease-in forwards;
            background-color: rgba(50, 50, 50, 0.2);
            border: 2px solid var(--normal-border-color);
        }
        .game {
            width: calc(100% - 10px);
            margin: 5px;
            aspect-ratio: 16 / 9;
            border-radius: 15px;
            animation: fadeIn 0.5s ease-in forwards;
            background-color: rgba(50, 50, 50, 0.2);
            border: none;
        }
        .widget {
            width: 300px;
            height: 250px;
            border-radius: 20px;
            animation: fadeIn 0.5s ease-in forwards;
            background-color: rgba(50, 50, 50, 0.2);
            border: 2px solid var(--normal-border-color);
            margin-left: 20px;
            padding: 15px;
        }
        .music-player img {
            width: auto;
            height: 120px;
            margin-left: 50%;
            transform: translateX(-50%);
            border-radius: 15px;
        }
        .music-player h1 {
            font-size: 24px;
            text-align: center;
            margin-top: 5px;
        }
        .music-player h2 {
            font-size: 18px;
            text-align: center;
            margin-top: -5px;
        }
        .controls-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .control {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: transparent;
            border: 2px solid var(--normal-border-color);
        }
        .icon {
            margin-left: 50%;
            margin-top: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="fade-down" id="nav-placeholder"></div>
    <div class="container">
        <div class="game-container">
            <iframe class="game" src="https://example.com"></iframe>
        </div>
        <div class="widget music-player">
            <img src="https://upload.wikimedia.org/wikipedia/en/2/23/Travis_Scott_-_Utopia.png">
            <h1>Chromakopia</h1>
            <h2>Travis Scott</h2>
            <div class="controls-container">
                <div class="control">
                    <i class="fa-solid fa-backward icon"></i>
                </div>
                <div class="control">
                    <i style="font-size: 24px;" class="fa-solid fa-pause icon"></i>
                </div>
                <div class="control">
                    <i class="fa-solid fa-forward icon"></i>
                </div>
            </div>            
        </div>
    </div>
</body>
</html>
